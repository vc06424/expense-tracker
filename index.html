<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <!-- Chart.js for the column-line chart -->
    <script src="[https://cdn.jsdelivr.net/npm/chart.js](https://cdn.jsdelivr.net/npm/chart.js)"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        
        <!-- Navigation -->
        <div class="flex border-b bg-gray-50">
            <button id="btn-dashboard" class="flex-1 py-4 font-bold text-blue-600 border-b-2 border-blue-600 hover:bg-gray-100 transition" onclick="switchTab('dashboard')">Dashboard</button>
            <button id="btn-comparison" class="flex-1 py-4 font-bold text-gray-500 hover:bg-gray-100 transition" onclick="switchTab('comparison')">Monthly Comparison</button>
        </div>

        <!-- PAGE 1: DASHBOARD -->
        <div id="page-dashboard" class="p-8 block">
            <h1 class="text-2xl font-bold mb-6 text-gray-700">Current Month Calculator</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <!-- Inflow Section -->
                <div class="bg-blue-50 p-6 rounded-lg border border-blue-100">
                    <h2 class="text-xl font-bold mb-4 text-blue-800">Inflow</h2>
                    <div class="flex justify-between items-center mb-3">
                        <label class="font-medium">Salary:</label>
                        <input type="number" id="in-salary" class="border rounded p-2 w-32 text-right input-calc" value="40000">
                    </div>
                    <div class="flex justify-between items-center mb-3">
                        <label class="font-medium">Other Income:</label>
                        <input type="number" id="in-other" class="border rounded p-2 w-32 text-right input-calc" value="5000">
                    </div>
                    <div class="mt-4 pt-4 border-t border-blue-200 flex justify-between font-bold text-lg">
                        <span>Total Inflow:</span>
                        <span>$<span id="total-inflow">45000</span></span>
                    </div>
                </div>

                <!-- Outflow Section -->
                <div class="bg-red-50 p-6 rounded-lg border border-red-100">
                    <h2 class="text-xl font-bold mb-4 text-red-800">Outflow</h2>
                    <div class="flex justify-between items-center mb-3">
                        <label class="font-medium">Housing:</label>
                        <input type="number" id="out-housing" class="border rounded p-2 w-32 text-right input-calc" value="12000">
                    </div>
                    <!-- 2. ADDED "LOAN" AFTER HOUSING -->
                    <div class="flex justify-between items-center mb-3">
                        <label class="font-medium text-red-600">Loan:</label>
                        <input type="number" id="out-loan" class="border rounded p-2 border-red-300 w-32 text-right input-calc" value="3000">
                    </div>
                    <div class="flex justify-between items-center mb-3">
                        <label class="font-medium">Food & Transport:</label>
                        <input type="number" id="out-living" class="border rounded p-2 w-32 text-right input-calc" value="6000">
                    </div>
                    <div class="mt-4 pt-4 border-t border-red-200 flex justify-between font-bold text-lg">
                        <span>Total Outflow:</span>
                        <span>$<span id="total-outflow">21000</span></span>
                    </div>
                </div>
            </div>

            <!-- Summary Section -->
            <div class="bg-gray-800 text-white p-6 rounded-lg shadow-inner mb-6">
                <div class="flex justify-between items-center text-xl font-bold">
                    <span>Summary (Inflow - Outflow):</span>
                    <span>$<span id="summary-value">24000</span></span>
                </div>
            </div>

            </div>

        <div id="page-comparison" class="p-8 hidden">

    <script>
        // Real-time calculation logic
        function calculateDashboard() {
            // Get inputs (default to 0 if empty)
            const getVal = (id) => parseFloat(document.getElementById(id).value) || 0;

            const inflow = getVal('in-salary') + getVal('in-other');
            const outflow = getVal('out-housing') + getVal('out-loan') + getVal('out-living'); // Loan included here
            const summary = inflow - outflow;
            const transferBea = getVal('transfer-bea');
            const happySurplus = summary - transferBea;

            // Update DOM elements
            document.getElementById('total-inflow').innerText = inflow.toLocaleString();
            document.getElementById('total-outflow').innerText = outflow.toLocaleString();
            document.getElementById('summary-value').innerText = summary.toLocaleString();
            document.getElementById('happy-surplus').innerText = happySurplus.toLocaleString();
        }

        // Attach event listeners to all inputs to trigger calculation on change
        document.querySelectorAll('.input-calc').forEach(input => {
            input.addEventListener('input', calculateDashboard);
        });

        // Initial calculation on load
        calculateDashboard();

        // Tab Switching Logic
        function switchTab(tabId) {
            const dashPage = document.getElementById('page-dashboard');
            const compPage = document.getElementById('page-comparison');
            const btnDash = document.getElementById('btn-dashboard');
            const btnComp = document.getElementById('btn-comparison');

            if (tabId === 'dashboard') {
                dashPage.classList.remove('hidden');
                dashPage.classList.add('block');
                compPage.classList.remove('block');
                compPage.classList.add('hidden');
                
                btnDash.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                btnDash.classList.remove('text-gray-500');
                btnComp.classList.add('text-gray-500');
                btnComp.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            } else {
                dashPage.classList.remove('block');
                dashPage.classList.add('hidden');
                compPage.classList.remove('hidden');
                compPage.classList.add('block');
                
                btnComp.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                btnComp.classList.remove('text-gray-500');
                btnDash.classList.add('text-gray-500');
                btnDash.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                
                // Render chart when switching to the tab for proper sizing
                renderChart();
            }
        }

        // Chart.js Setup for Column-Line Chart
        let myChart = null;
        function renderChart() {
            if (myChart) return; // Prevent re-rendering multiple times

            const ctx = document.getElementById('financeChart').getContext('2d');
            
            // Sample data for the last 6 months
            const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
            
            myChart = new Chart(ctx, {
                type: 'bar', // Base type is column (bar)
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'line', // Line chart for Happy Surplus
                            label: 'Happy Surplus',
                            data: [8000, 12000, 9500, 14000, 11000, 14000], // Example data
                            borderColor: '#ec4899', // Pink-500 to match the sharp color theme
                            backgroundColor: '#ec4899',
                            borderWidth: 3,
                            tension: 0.3,
                            fill: false,
                            order: 1 // Draws line on top of columns
                        },
                        {
                            type: 'bar',
                            label: 'Inflow',
                            data: [42000, 45000, 42000, 45000, 46000, 45000],
                            backgroundColor: 'rgba(59, 130, 246, 0.7)', // Blue
                            order: 2
                        },
                        {
                            type: 'bar',
                            label: 'Outflow',
                            data: [24000, 23000, 22500, 21000, 25000, 21000],
                            backgroundColor: 'rgba(239, 68, 68, 0.7)', // Red
                            order: 3
                        },
                        {
                            type: 'bar',
                            label: 'Transfer to BEA',
                            data: [10000, 10000, 10000, 10000, 10000, 10000],
                            backgroundColor: 'rgba(168, 85, 247, 0.7)', // Purple
                            order: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) { label += ': '; }
                                    if (context.parsed.y !== null) {
                                        label += new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: '#f3f4f6'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
