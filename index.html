<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #121218;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    .glow-surplus {
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }
  </style>
</head>
<body class="bg-[#121218] min-h-screen flex justify-center items-center p-0 sm:p-4">
  <div id="root" class="w-full max-w-md bg-[#1A1A24] min-h-screen sm:min-h-[844px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-gray-800"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icons
    const Icons = {
      ChevronLeft: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>,
      ChevronRight: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
      ChevronDown: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>,
      ChevronUp: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7" /></svg>,
      Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
      List: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
      Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
      Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      BarChart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
      
      // Category Icons
      Wine: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v6m-4 0h8m-7-11a5 5 0 0010 0V4H7v6z" /></svg>,
      Housing: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
      Loan: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
      Utensils: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>,
      Baby: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Cart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
      Train: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h8m-8 4h8m-5 8l-2 2m4-2l2 2M5 3h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z" /></svg>,
      Bag: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>,
      Film: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" /></svg>,
      More: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" /></svg>,
      Income: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Bank: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" /></svg>
    };

    // Metadata
    const CATEGORIES = {
      Living: { label: 'Living', icon: 'Wine', color: 'text-purple-400', bg: 'bg-purple-900/30' },
      Housing: { label: 'Housing', icon: 'Housing', color: 'text-blue-400', bg: 'bg-blue-900/30' },
      Loan: { label: 'Loan', icon: 'Loan', color: 'text-amber-400', bg: 'bg-amber-900/30' },
      Meals: { label: 'Meals', icon: 'Utensils', color: 'text-orange-400', bg: 'bg-orange-900/30' },
      BBNecessities: { label: 'BB Necessities', icon: 'Baby', color: 'text-pink-400', bg: 'bg-pink-900/30' },
      Groceries: { label: 'Groceries', icon: 'Cart', color: 'text-emerald-400', bg: 'bg-emerald-900/30' },
      Transport: { label: 'Transport', icon: 'Train', color: 'text-sky-400', bg: 'bg-sky-900/30' },
      Shopping: { label: 'Shopping', icon: 'Bag', color: 'text-yellow-400', bg: 'bg-yellow-900/30' },
      Entertainment: { label: 'Entertainment', icon: 'Film', color: 'text-indigo-400', bg: 'bg-indigo-900/30' },
      Others: { label: 'Others', icon: 'More', color: 'text-gray-400', bg: 'bg-gray-800/40' },
    };

    const GROUPS = [
      { name: 'Project', keys: ['Living', 'Housing', 'Loan'] },
      { name: 'Unallocated', keys: ['Meals', 'BBNecessities', 'Groceries', 'Transport'] },
      { name: 'Unset', keys: ['Shopping', 'Entertainment', 'Others'] },
    ];

    const INITIAL_BUDGETS = {
      Living: 6600, Housing: 15000, Loan: 0, Meals: 4000, BBNecessities: 2000,
      Groceries: 1500, Transport: 500, Shopping: 1000, Entertainment: 500, Others: 500,
    };

    const getTodayDate = () => {
      const d = new Date();
      const month = `${d.getMonth() + 1}`.padStart(2, '0');
      const day = `${d.getDate()}`.padStart(2, '0');
      return `${d.getFullYear()}-${month}-${day}`;
    };

    const formatCurrency = (val) => {
      return 'HK$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    // Column-Line Combo Chart Component
    function ColumnLineChart({ monthlyData }) {
      const height = 220;
      const width = 340;
      const padding = { top: 20, right: 15, bottom: 40, left: 15 };

      const maxVal = useMemo(() => {
        let m = 1000;
        monthlyData.forEach(d => {
          m = Math.max(m, d.inflow, d.outflow, d.bea, Math.abs(d.happySurplus));
        });
        return m * 1.15;
      }, [monthlyData]);

      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const stepX = chartWidth / Math.max(monthlyData.length, 1);
      const barGroupWidth = Math.min(stepX * 0.65, 32);
      const singleBarWidth = barGroupWidth / 3;

      const linePoints = monthlyData.map((d, i) => {
        const x = padding.left + i * stepX + stepX / 2;
        const clampedVal = Math.max(0, d.happySurplus);
        const y = padding.top + chartHeight - (clampedVal / maxVal) * chartHeight;
        return { x, y, val: d.happySurplus };
      });

      const svgLinePath = linePoints.length > 0 
        ? linePoints.reduce((acc, pt, i) => i === 0 ? `M ${pt.x} ${pt.y}` : `${acc} L ${pt.x} ${pt.y}`, '')
        : '';

      return (
        <div className="bg-gray-900/80 border border-gray-800 rounded-2xl p-4 space-y-3">
          <div className="flex items-center justify-between">
            <h3 className="text-xs font-bold uppercase tracking-wider text-gray-400">Current & Past 5 Months</h3>
            <span className="text-[10px] text-cyan-400 font-semibold bg-cyan-950/60 border border-cyan-800/50 px-2 py-0.5 rounded-full">
              Columns + Surplus Line
            </span>
          </div>

          <div className="relative flex justify-center">
            <svg width={width} height={height} className="overflow-visible">
              {[0, 0.33, 0.66, 1].map((ratio, idx) => {
                const y = padding.top + chartHeight * (1 - ratio);
                return (
                  <g key={idx}>
                    <line x1={padding.left} y1={y} x2={width - padding.right} y2={y} stroke="#2D3748" strokeDasharray="3 3" strokeWidth="1" />
                  </g>
                );
              })}

              {monthlyData.map((d, i) => {
                const groupCenterX = padding.left + i * stepX + stepX / 2;
                const startX = groupCenterX - barGroupWidth / 2;

                const hInflow = (d.inflow / maxVal) * chartHeight;
                const hOutflow = (d.outflow / maxVal) * chartHeight;
                const hBea = (d.bea / maxVal) * chartHeight;

                const yInflow = padding.top + chartHeight - hInflow;
                const yOutflow = padding.top + chartHeight - hOutflow;
                const yBea = padding.top + chartHeight - hBea;

                return (
                  <g key={d.month}>
                    <rect x={startX} y={yInflow} width={singleBarWidth - 1} height={Math.max(hInflow, 2)} fill="#10B981" rx="2" />
                    <rect x={startX + singleBarWidth} y={yOutflow} width={singleBarWidth - 1} height={Math.max(hOutflow, 2)} fill="#EF4444" rx="2" />
                    <rect x={startX + singleBarWidth * 2} y={yBea} width={singleBarWidth - 1} height={Math.max(hBea, 2)} fill="#8B5CF6" rx="2" />
                    <text x={groupCenterX} y={height - 12} fill="#94A3B8" fontSize="10" textAnchor="middle" fontWeight="500">
                      {d.label}
                    </text>
                  </g>
                );
              })}

              {svgLinePath && <path d={svgLinePath} fill="none" stroke="#00F0FF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />}
              {linePoints.map((pt, i) => (
                <g key={i}>
                  <circle cx={pt.x} cy={pt.y} r="4" fill="#00F0FF" stroke="#1A1A24" strokeWidth="2" />
                </g>
              ))}
            </svg>
          </div>

          <div className="grid grid-cols-2 gap-2 pt-2 border-t border-gray-800 text-[11px]">
            <div className="flex items-center space-x-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"></span><span className="text-gray-300">Inflow (Green)</span></div>
            <div className="flex items-center space-x-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-red-500 inline-block"></span><span className="text-gray-300">Outflow (Red)</span></div>
            <div className="flex items-center space-x-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-purple-500 inline-block"></span><span className="text-gray-300">BEA Transfer (Purple)</span></div>
            <div className="flex items-center space-x-1.5"><span className="w-2.5 h-0.5 bg-cyan-400 inline-block"></span><span className="text-cyan-400 font-medium">Happy Surplus (Line)</span></div>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('input');
      
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('et_transactions');
        return saved ? JSON.parse(saved) : [];
      });

      // Merge saved budgets with INITIAL_BUDGETS to guarantee new categories (like Loan) appear
      const [budgets, setBudgets] = useState(() => {
        const saved = localStorage.getItem('et_budgets');
        return saved ? { ...INITIAL_BUDGETS, ...JSON.parse(saved) } : INITIAL_BUDGETS;
      });

      const [beaTransfers, setBeaTransfers] = useState(() => {
        const saved = localStorage.getItem('et_bea_transfers');
        return saved ? JSON.parse(saved) : {};
      });

      const [formId, setFormId] = useState(null);
      const [formType, setFormType] = useState('expense');
      const [formCategory, setFormCategory] = useState('Meals');
      const [formAmount, setFormAmount] = useState('');
      const [formDate, setFormDate] = useState(getTodayDate());
      const [formRemark, setFormRemark] = useState('');

      const [expandedGroups, setExpandedGroups] = useState({ Project: true, Unallocated: true, Unset: true });
      const [showRemarks, setShowRemarks] = useState(false);
      const [viewMonth, setViewMonth] = useState(() => getTodayDate().substring(0, 7));

      useEffect(() => { localStorage.setItem('et_transactions', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('et_budgets', JSON.stringify(budgets)); }, [budgets]);
      useEffect(() => { localStorage.setItem('et_bea_transfers', JSON.stringify(beaTransfers)); }, [beaTransfers]);

      const currentMonthTxs = useMemo(() => transactions.filter(t => t.date.startsWith(viewMonth)), [transactions, viewMonth]);
      const expenses = currentMonthTxs.filter(t => t.type === 'expense');
      const incomes = currentMonthTxs.filter(t => t.type === 'income');

      const totalOutflow = expenses.reduce((sum, t) => sum + Number(t.amount), 0);
      const totalInflow = incomes.reduce((sum, t) => sum + Number(t.amount), 0);
      const netTotal = totalInflow - totalOutflow;

      const currentBeaTransfer = Number(beaTransfers[viewMonth] || 0);
      const happySurplus = netTotal - currentBeaTransfer;

      // 6-Month rolling view data strictly for the chart
      const monthlyComparisonData = useMemo(() => {
        const result = [];
        const curr = new Date(viewMonth + '-01');

        for (let i = 5; i >= 0; i--) {
          const d = new Date(curr.getFullYear(), curr.getMonth() - i, 1);
          const monthKey = `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}`;
          const label = d.toLocaleString('default', { month: 'short' });

          const monthTxs = transactions.filter(t => t.date.startsWith(monthKey));
          const inflow = monthTxs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
          const outflow = monthTxs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
          const summary = inflow - outflow;
          const bea = Number(beaTransfers[monthKey] || 0);
          const surplus = summary - bea;

          result.push({ month: monthKey, label, inflow, outflow, summary, bea, happySurplus: surplus });
        }
        return result;
      }, [transactions, beaTransfers, viewMonth]);

      // Complete historical list of all recorded months
      const allHistoricalMonthsData = useMemo(() => {
        const monthSet = new Set();
        transactions.forEach(t => monthSet.add(t.date.substring(0, 7)));
        Object.keys(beaTransfers).forEach(m => monthSet.add(m));
        
        if (monthSet.size === 0) monthSet.add(viewMonth);

        const sortedMonths = Array.from(monthSet).sort().reverse();

        return sortedMonths.map(monthKey => {
          const d = new Date(monthKey + '-01');
          const label = d.toLocaleString('default', { month: 'long', year: 'numeric' });
          
          const monthTxs = transactions.filter(t => t.date.startsWith(monthKey));
          const inflow = monthTxs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
          const outflow = monthTxs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
          const summary = inflow - outflow;
          const bea = Number(beaTransfers[monthKey] || 0);
          const surplus = summary - bea;

          return { month: monthKey, label, inflow, outflow, summary, bea, happySurplus: surplus };
        });
      }, [transactions, beaTransfers, viewMonth]);

      const handleBeaTransferChange = (val) => {
        const numVal = Math.max(0, Number(val) || 0);
        setBeaTransfers(prev => ({ ...prev, [viewMonth]: numVal }));
      };

      const resetForm = () => {
        setFormId(null);
        setFormType('expense');
        setFormCategory('Meals');
        setFormAmount('');
        setFormDate(getTodayDate());
        setFormRemark('');
      };

      const handleSave = () => {
        if (!formAmount || Number(formAmount) <= 0) return alert("Please enter a valid amount.");
        
        const newTx = {
          id: formId || Date.now().toString(),
          type: formType,
          category: formType === 'expense' ? formCategory : 'Income',
          amount: Number(formAmount),
          date: formDate,
          remark: formRemark
        };

        if (formId) {
          setTransactions(prev => prev.map(t => t.id === formId ? newTx : t));
          setView('history');
        } else {
          setTransactions(prev => [newTx, ...prev]);
          resetForm();
        }
      };

      const handleDelete = (id) => {
        if(confirm("Are you sure you want to delete this record?")) {
          setTransactions(prev => prev.filter(t => t.id !== id));
          setView('history');
        }
      };

      const openEdit = (tx) => {
        setFormId(tx.id);
        setFormType(tx.type);
        setFormCategory(tx.category !== 'Income' ? tx.category : 'Meals');
        setFormAmount(tx.amount);
        setFormDate(tx.date);
        setFormRemark(tx.remark || '');
        setView('edit');
      };

      const renderTopBar = () => {
        let title, leftBtn, rightBtns;
        
        if (view === 'input') {
          title = "New Record";
          leftBtn = <div className="w-8"></div>;
          rightBtns = (
            <div className="flex space-x-1">
              <button onClick={() => setView('dashboard')} title="Dashboard" className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.Dashboard /></button>
              <button onClick={() => setView('analytics')} title="Monthly Chart" className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.BarChart /></button>
              <button onClick={() => setView('history')} title="History" className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.List /></button>
            </div>
          );
        } else if (view === 'dashboard') {
          title = "Dashboard";
          leftBtn = <button onClick={() => { resetForm(); setView('input'); }} title="Add Record" className="p-1.5 rounded-full hover:bg-gray-800 text-purple-400 transition"><Icons.Plus /></button>;
          rightBtns = (
            <div className="flex space-x-1">
              <button onClick={() => setView('analytics')} title="Monthly Comparison" className="p-1.5 rounded-full hover:bg-gray-800 text-cyan-400 transition"><Icons.BarChart /></button>
              <button onClick={() => setView('settings')} title="Settings" className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.Settings /></button>
              <button onClick={() => setView('history')} title="History" className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.List /></button>
            </div>
          );
        } else if (view === 'analytics') {
          title = "Monthly Comparison";
          leftBtn = <button onClick={() => setView('dashboard')} className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.ChevronLeft /></button>;
          rightBtns = (
            <div className="flex space-x-1">
              <button onClick={() => setView('settings')} title="Settings" className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.Settings /></button>
              <button onClick={() => setView('history')} title="History" className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.List /></button>
            </div>
          );
        } else {
          title = view.charAt(0).toUpperCase() + view.slice(1);
          leftBtn = <button onClick={() => setView(view === 'edit' ? 'history' : 'dashboard')} className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"><Icons.ChevronLeft /></button>;
          rightBtns = <div className="w-8"></div>;
        }

        return (
          <div className="pt-6 pb-3 px-4 flex items-center justify-between border-b border-gray-800 bg-[#1A1A24]/90 backdrop-blur sticky top-0 z-20">
            {leftBtn}
            <h1 className="text-base font-bold tracking-wide text-gray-100">{title}</h1>
            {rightBtns}
          </div>
        );
      };

      const renderForm = () => (
        <div className="flex-1 p-5 space-y-6 overflow-y-auto no-scrollbar">
          <div className="flex bg-gray-900 rounded-xl p-1 border border-gray-800">
            <button onClick={() => setFormType('expense')} className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${formType === 'expense' ? 'bg-red-500/20 text-red-400 shadow' : 'text-gray-500 hover:text-gray-300'}`}>Expense</button>
            <button onClick={() => setFormType('income')} className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${formType === 'income' ? 'bg-emerald-500/20 text-emerald-400 shadow' : 'text-gray-500 hover:text-gray-300'}`}>Income</button>
          </div>

          <div className="space-y-2">
            <label className="text-xs text-gray-400 font-medium ml-1">Amount</label>
            <div className="flex items-center bg-gray-900/50 border border-gray-800 rounded-xl px-4 py-3">
              <span className={`text-lg font-bold mr-2 ${formType === 'expense' ? 'text-red-400' : 'text-emerald-400'}`}>HK$</span>
              <input type="number" placeholder="0.00" value={formAmount} onChange={(e) => setFormAmount(e.target.value)} className="bg-transparent flex-1 text-2xl text-white focus:outline-none" />
            </div>
          </div>

          {formType === 'expense' && (
            <div className="space-y-2">
              <label className="text-xs text-gray-400 font-medium ml-1">Category</label>
              <div className="grid grid-cols-3 gap-2">
                {Object.entries(CATEGORIES).map(([key, data]) => {
                  const Icon = Icons[data.icon] || Icons.More;
                  const isSelected = formCategory === key;
                  return (
                    <button key={key} onClick={() => setFormCategory(key)} className={`flex flex-col items-center justify-center p-3 rounded-xl border transition ${isSelected ? `border-gray-500 ${data.bg}` : 'border-gray-800 bg-gray-900/40 hover:bg-gray-800'}`}>
                      <div className={`mb-1 ${isSelected ? data.color : 'text-gray-500'}`}><Icon /></div>
                      <span className={`text-[10px] ${isSelected ? 'text-white font-medium' : 'text-gray-500'}`}>{data.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <div className="space-y-2">
            <label className="text-xs text-gray-400 font-medium ml-1">Date</label>
            <input type="date" value={formDate} onChange={(e) => setFormDate(e.target.value)} className="w-full bg-gray-900/50 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none" />
          </div>

          <div className="space-y-2">
            <label className="text-xs text-gray-400 font-medium ml-1">Remarks (Optional)</label>
            <input type="text" placeholder="What was this for?" value={formRemark} onChange={(e) => setFormRemark(e.target.value)} className="w-full bg-gray-900/50 border border-gray-800 rounded-xl px-4 py-3 text-white focus:outline-none" />
          </div>

          <div className="pt-4 flex gap-3">
            {view === 'edit' && (
              <button onClick={() => handleDelete(formId)} className="p-3 bg-red-900/30 text-red-400 border border-red-900 rounded-xl hover:bg-red-900/50 transition">
                <Icons.Trash />
              </button>
            )}
            <button onClick={handleSave} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl shadow-lg transition">
              {view === 'edit' ? 'Update Record' : 'Save Record'}
            </button>
          </div>
        </div>
      );

      return (
        <div className="flex flex-col h-full text-slate-100 select-none">
          {renderTopBar()}

          {(view === 'input' || view === 'edit') && renderForm()}

          {view === 'dashboard' && (
            <div className="flex-1 overflow-y-auto no-scrollbar pb-10">
              <div className="flex items-center justify-between px-6 py-3 text-sm text-gray-400 border-b border-gray-800/60 bg-[#161620]">
                <button className="p-1 hover:text-white" onClick={() => {
                  let [y, m] = viewMonth.split('-');
                  m = Number(m) - 1;
                  if(m === 0) { m = 12; y = Number(y) - 1; }
                  setViewMonth(`${y}-${m.toString().padStart(2, '0')}`);
                }}><Icons.ChevronLeft /></button>
                <span className="font-medium tracking-wider text-gray-300">
                  {new Date(viewMonth + '-01').toLocaleString('default', { month: 'long', year: 'numeric' })}
                </span>
                <button className="p-1 hover:text-white" onClick={() => {
                  let [y, m] = viewMonth.split('-');
                  m = Number(m) + 1;
                  if(m === 13) { m = 1; y = Number(y) + 1; }
                  setViewMonth(`${y}-${m.toString().padStart(2, '0')}`);
                }}><Icons.ChevronRight /></button>
              </div>

              <div className="p-4 space-y-3 bg-[#1A1A24]">
                <div className="space-y-1">
                  <div className="flex justify-between items-center text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-gray-400 font-medium">Outflow</span>
                      <span className="bg-red-500/20 text-red-400 text-[10px] px-2 py-0.5 rounded-full font-bold">{expenses.length}</span>
                    </div>
                    <span className="font-semibold text-red-400">-{formatCurrency(totalOutflow)}</span>
                  </div>
                  <div className="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div className="h-full bg-[#FF4D4D] rounded-full transition-all duration-500" style={{ width: `${Math.min((totalOutflow / (totalInflow || 1)) * 100, 100)}%` }} />
                  </div>
                </div>

                <div className="space-y-1">
                  <div className="flex justify-between items-center text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-gray-400 font-medium">Inflow</span>
                      <span className="bg-green-500/20 text-green-400 text-[10px] px-2 py-0.5 rounded-full font-bold">{incomes.length}</span>
                      <button onClick={() => setShowRemarks(!showRemarks)} className="text-[10px] text-blue-400 bg-blue-500/10 px-1.5 py-0.5 rounded border border-blue-500/20 hover:bg-blue-500/20">
                        {showRemarks ? 'Hide Log' : 'Show Log'}
                      </button>
                    </div>
                    <span className="font-semibold text-emerald-400">{formatCurrency(totalInflow)}</span>
                  </div>
                  <div className="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div className="h-full bg-[#4CAF50] rounded-full w-full" />
                  </div>

                  {showRemarks && incomes.length > 0 && (
                    <div className="mt-2 p-2 bg-gray-900/80 rounded-lg text-xs border border-gray-800 max-h-32 overflow-y-auto">
                      {incomes.map((inc) => (
                        <div key={inc.id} className="flex justify-between items-center py-1 border-b border-gray-800/50 last:border-0">
                          <div className="truncate pr-2">
                            <span className="text-gray-300">{inc.date.substring(5)}</span>
                            <span className="text-gray-500 italic ml-2">{inc.remark || 'Income'}</span>
                          </div>
                          <span className="text-emerald-400 font-medium shrink-0">{formatCurrency(inc.amount)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="space-y-1 pt-1">
                  <div className="flex justify-between items-center text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-gray-400 font-medium">Summary</span>
                      <span className="bg-purple-500/20 text-purple-300 text-[10px] px-2 py-0.5 rounded-full font-bold">Net</span>
                    </div>
                    <span className={`font-semibold ${netTotal >= 0 ? 'text-purple-300' : 'text-red-400'}`}>
                      {netTotal >= 0 ? '+' : ''}{formatCurrency(netTotal)}
                    </span>
                  </div>
                  <div className="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div className="h-full bg-[#9C27B0] rounded-full transition-all duration-500" style={{ width: `${Math.min((Math.max(netTotal, 0) / (totalInflow || 1)) * 100, 100)}%` }} />
                  </div>
                </div>

                <div className="pt-2">
                  <div className="bg-purple-950/30 border border-purple-800/40 rounded-xl p-3 flex justify-between items-center">
                    <div className="flex items-center space-x-2">
                      <div className="p-1.5 bg-purple-500/20 text-purple-400 rounded-lg"><Icons.Bank /></div>
                      <label className="text-xs font-semibold text-purple-200">Transfer to BEA</label>
                    </div>
                    <div className="flex items-center space-x-1 bg-gray-900/80 border border-purple-900/60 rounded-lg px-2 py-1">
                      <span className="text-xs text-purple-400 font-medium">HK$</span>
                      <input type="number" placeholder="0.00" value={beaTransfers[viewMonth] || ''} onChange={(e) => handleBeaTransferChange(e.target.value)} className="w-24 bg-transparent text-right text-sm font-bold text-white focus:outline-none" />
                    </div>
                  </div>
                </div>

                <div className="mt-2 bg-gradient-to-r from-cyan-950/60 via-slate-900 to-cyan-950/60 border border-cyan-500/40 rounded-xl p-3.5 text-center shadow-lg relative overflow-hidden">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-cyan-300/80 mb-0.5">Happy Surplus</div>
                  <div className="text-2xl font-black text-[#00F0FF] glow-surplus tracking-tight my-1">
                    {happySurplus >= 0 ? '' : '-'}{formatCurrency(Math.abs(happySurplus))}
                  </div>
                  <div className="inline-block mt-1 px-3 py-1 bg-cyan-400/10 border border-cyan-400/30 rounded-full text-[11px] font-semibold text-cyan-300 italic">
                    ✨ Think how to spend or invest!
                  </div>
                </div>
              </div>

              <div className="mt-2 divide-y divide-gray-800/60">
                {GROUPS.map((group) => {
                  const isExpanded = expandedGroups[group.name];
                  let groupTotal = 0;
                  const groupCats = group.keys.map(key => {
                    const catTxs = expenses.filter(t => t.category === key);
                    const amount = catTxs.reduce((s, t) => s + Number(t.amount), 0);
                    groupTotal += amount;
                    return { key, amount, count: catTxs.length, meta: CATEGORIES[key] };
                  }).filter(c => c.count > 0);

                  return (
                    <div key={group.name} className="bg-[#1A1A24]">
                      <button onClick={() => setExpandedGroups(p => ({...p, [group.name]: !p[group.name]}))} className="w-full px-4 py-3 flex justify-between items-center bg-[#181822] hover:bg-[#1f1f2c] transition">
                        <div className="flex items-center space-x-2">
                          <span className="font-semibold text-sm text-gray-300">{group.name}</span>
                          <span className="bg-gray-800 text-gray-400 text-xs px-2 py-0.5 rounded-full">{groupCats.length}</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <span className="text-xs font-medium text-gray-400">{formatCurrency(groupTotal)}</span>
                          <span className="text-gray-500">{isExpanded ? <Icons.ChevronUp /> : <Icons.ChevronDown />}</span>
                        </div>
                      </button>
                      {isExpanded && (
                        <div className="divide-y divide-gray-800/40 px-2">
                          {groupCats.length === 0 ? (
                            <div className="p-4 text-center text-xs text-gray-500">No expenses in this group yet.</div>
                          ) : groupCats.map((cat) => {
                            const IconComp = Icons[cat.meta.icon] || Icons.More;
                            const budget = budgets[cat.key] || 0;
                            return (
                              <div key={cat.key} className="p-3 flex items-center justify-between hover:bg-gray-800/30 rounded-xl transition">
                                <div className="flex items-center space-x-3">
                                  <div className={`w-10 h-10 rounded-full flex items-center justify-center ${cat.meta.bg} ${cat.meta.color}`}><IconComp /></div>
                                  <div>
                                    <div className="font-medium text-sm text-gray-100">{cat.meta.label}</div>
                                    <div className="text-xs text-gray-500">{cat.count} Items</div>
                                  </div>
                                </div>
                                <div className="text-right">
                                  <div className="text-sm font-semibold text-red-400">{formatCurrency(cat.amount)}</div>
                                  <div className="text-xs text-gray-500 mt-0.5">{budget > 0 ? `${cat.amount.toLocaleString()} / ${budget.toLocaleString()}` : 'Unallocated'}</div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <div className="p-4">
                <button onClick={() => setView('analytics')} className="w-full bg-gradient-to-r from-cyan-900/40 to-purple-900/40 border border-cyan-500/30 text-cyan-300 py-3 rounded-xl font-semibold text-xs flex items-center justify-center space-x-2 hover:bg-cyan-900/60 transition shadow">
                  <Icons.BarChart />
                  <span>View Full Monthly Comparison Chart</span>
                </button>
              </div>
            </div>
          )}

          {/* --- MONTHLY COMPARISON PAGE --- */}
          {view === 'analytics' && (
            <div className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-5">
              <div className="text-center space-y-1">
                <h2 className="text-lg font-bold text-white">Monthly Comparison</h2>
                <p className="text-xs text-gray-400">Inflow, Outflow, BEA Transfer & Happy Surplus Trend</p>
              </div>

              {/* Chart displays restricted 6-month window */}
              <ColumnLineChart monthlyData={monthlyComparisonData} />

              {/* List underneath displays ALL historical data from transactions */}
              <div className="space-y-3">
                <h3 className="text-xs font-bold uppercase tracking-wider text-gray-400 px-1">All Historical Breakdown Data</h3>
                <div className="space-y-2">
                  {allHistoricalMonthsData.map(m => (
                    <div key={m.month} className="bg-gray-900/60 border border-gray-800 rounded-xl p-3 space-y-2">
                      <div className="flex justify-between items-center border-b border-gray-800/60 pb-2">
                        <span className="text-sm font-bold text-gray-200">{m.label}</span>
                        <span className="text-xs font-bold text-[#00F0FF]">
                          Happy Surplus: {formatCurrency(m.happySurplus)}
                        </span>
                      </div>
                      <div className="grid grid-cols-3 gap-2 text-center text-[11px]">
                        <div className="bg-emerald-950/30 border border-emerald-800/30 p-2 rounded-lg">
                          <div className="text-gray-400">Inflow</div>
                          <div className="font-semibold text-emerald-400 mt-0.5">{formatCurrency(m.inflow)}</div>
                        </div>
                        <div className="bg-red-950/30 border border-red-800/30 p-2 rounded-lg">
                          <div className="text-gray-400">Outflow</div>
                          <div className="font-semibold text-red-400 mt-0.5">{formatCurrency(m.outflow)}</div>
                        </div>
                        <div className="bg-purple-950/30 border border-purple-800/30 p-2 rounded-lg">
                          <div className="text-gray-400">BEA Transfer</div>
                          <div className="font-semibold text-purple-300 mt-0.5">{formatCurrency(m.bea)}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {view === 'history' && (
            <div className="flex-1 overflow-y-auto no-scrollbar p-2">
              {transactions.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-gray-500 space-y-3">
                  <Icons.List />
                  <p className="text-sm">No transaction history.</p>
                </div>
              ) : (
                <div className="space-y-2">
                  {transactions.sort((a,b) => new Date(b.date) - new Date(a.date)).map(tx => {
                    const isIncome = tx.type === 'income';
                    const meta = isIncome ? { label: 'Income', icon: 'Income', bg: 'bg-emerald-900/30', color: 'text-emerald-400' } : CATEGORIES[tx.category];
                    const Icon = Icons[meta?.icon] || Icons.More;

                    return (
                      <div key={tx.id} onClick={() => openEdit(tx)} className="bg-gray-900/50 border border-gray-800 p-3 rounded-xl flex items-center justify-between cursor-pointer hover:bg-gray-800 transition">
                        <div className="flex items-center space-x-3 overflow-hidden">
                          <div className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center ${meta?.bg || 'bg-gray-800'} ${meta?.color || 'text-gray-300'}`}><Icon /></div>
                          <div className="truncate">
                            <div className="text-sm font-medium text-gray-200">{meta?.label || tx.category} <span className="text-xs text-gray-500 font-normal ml-1">{tx.date}</span></div>
                            {tx.remark && <div className="text-xs text-gray-400 truncate">{tx.remark}</div>}
                          </div>
                        </div>
                        <div className={`text-sm font-bold shrink-0 pl-2 ${isIncome ? 'text-emerald-400' : 'text-red-400'}`}>
                          {isIncome ? '+' : '-'}{formatCurrency(tx.amount)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {view === 'settings' && (
             <div className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-6">
              <div>
                <h2 className="text-base font-semibold text-purple-400 mb-1">Monthly Category Budgets</h2>
                <p className="text-xs text-gray-400 mb-4">Set your spending quotas per category.</p>
                <div className="space-y-3">
                  {/* Maps directly via CATEGORIES keys to ensure newly added categories display properly regardless of old localStorage */}
                  {Object.keys(CATEGORIES).map((key) => {
                    const val = budgets[key] || 0;
                    return (
                      <div key={key} className="bg-gray-900/60 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                        <label className="text-sm font-medium text-gray-200">{CATEGORIES[key].label}</label>
                        <div className="flex items-center space-x-2">
                          <span className="text-xs text-gray-500">HK$</span>
                          <input 
                            type="number" 
                            value={val}
                            onChange={(e) => setBudgets({ ...budgets, [key]: Number(e.target.value) })}
                            className="w-28 bg-gray-800 text-white text-right px-3 py-1.5 rounded-lg text-sm border border-gray-700 focus:outline-none focus:border-purple-500"
                          />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
