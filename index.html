<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Expense Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #121218;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#121218] min-h-screen flex justify-center items-center p-0 sm:p-4">
  <div id="root" class="w-full max-w-md bg-[#1A1A24] min-h-screen sm:min-h-[844px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-gray-800"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Built-in SVG Icons
    const Icons = {
      ChevronLeft: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
        </svg>
      ),
      ChevronRight: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
        </svg>
      ),
      ChevronDown: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
        </svg>
      ),
      ChevronUp: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7" />
        </svg>
      ),
      Settings: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      ),
      Grid: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
      ),
      Wine: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v6m-4 0h8m-7-11a5 5 0 0010 0V4H7v6z" />
        </svg>
      ),
      Housing: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      ),
      Utensils: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
      ),
      Baby: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Cart: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      ),
      Train: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h8m-8 4h8m-5 8l-2 2m4-2l2 2M5 3h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z" />
        </svg>
      ),
      Bag: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
      ),
      Film: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
        </svg>
      ),
      More: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" />
        </svg>
      )
    };

    // Defaults
    const INITIAL_BUDGETS = {
      Living: 6600,
      Housing: 15000,
      Meals: 4000,
      BBNecessities: 2000,
      Groceries: 1500,
      Transport: 500,
      Shopping: 1000,
      Entertainment: 500,
      Others: 500,
    };

    const INITIAL_EXPENSES = [
      { id: '1', category: 'Living', label: 'Living', amount: 3177.00, items: 10, icon: 'Wine', color: 'text-purple-400', bg: 'bg-purple-900/30' },
      { id: '2', category: 'Housing', label: 'Housing', amount: 12560.00, items: 2, icon: 'Housing', color: 'text-blue-400', bg: 'bg-blue-900/30' },
      { id: '3', category: 'Meals', label: 'Meals', amount: 3206.10, items: 24, icon: 'Utensils', color: 'text-orange-400', bg: 'bg-orange-900/30' },
      { id: '4', category: 'BBNecessities', label: 'BB Necessities', amount: 1725.00, items: 5, icon: 'Baby', color: 'text-pink-400', bg: 'bg-pink-900/30' },
      { id: '5', category: 'Groceries', label: 'Groceries', amount: 1305.10, items: 6, icon: 'Cart', color: 'text-emerald-400', bg: 'bg-emerald-900/30' },
      { id: '6', category: 'Transport', label: 'Transport', amount: 296.40, items: 18, icon: 'Train', color: 'text-sky-400', bg: 'bg-sky-900/30' },
      { id: '7', category: 'Shopping', label: 'Shopping', amount: 65.00, items: 1, icon: 'Bag', color: 'text-yellow-400', bg: 'bg-yellow-900/30' },
      { id: '8', category: 'Entertainment', label: 'Entertainment', amount: 17.00, items: 1, icon: 'Film', color: 'text-indigo-400', bg: 'bg-indigo-900/30' },
      { id: '9', category: 'Others', label: 'Others', amount: 0.00, items: 0, icon: 'More', color: 'text-gray-400', bg: 'bg-gray-800/40' },
    ];

    const INITIAL_INCOMES = [
      { id: 'inc1', source: 'Jobs', amount: 30000, remark: 'Monthly Salary & Freelance' },
      { id: 'inc2', source: 'Investment', amount: 10000, remark: 'Dividends & Yield' },
    ];

    const GROUPS = [
      { name: 'Project', keys: ['Living', 'Housing'] },
      { name: 'Unallocated', keys: ['Meals', 'BBNecessities', 'Groceries', 'Transport'] },
      { name: 'Unset', keys: ['Shopping', 'Entertainment', 'Others'] },
    ];

    function App() {
      const [view, setView] = useState('dashboard');
      
      const [budgets, setBudgets] = useState(() => {
        const saved = localStorage.getItem('et_budgets');
        return saved ? JSON.parse(saved) : INITIAL_BUDGETS;
      });

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem('et_expenses');
        return saved ? JSON.parse(saved) : INITIAL_EXPENSES;
      });

      const [incomes, setIncomes] = useState(() => {
        const saved = localStorage.getItem('et_incomes');
        return saved ? JSON.parse(saved) : INITIAL_INCOMES;
      });

      const [expandedGroups, setExpandedGroups] = useState({
        Project: true,
        Unallocated: true,
        Unset: true,
      });

      const [showRemarks, setShowRemarks] = useState(false);

      useEffect(() => {
        localStorage.setItem('et_budgets', JSON.stringify(budgets));
      }, [budgets]);

      useEffect(() => {
        localStorage.setItem('et_expenses', JSON.stringify(expenses));
      }, [expenses]);

      useEffect(() => {
        localStorage.setItem('et_incomes', JSON.stringify(incomes));
      }, [incomes]);

      const totalOutflow = useMemo(() => {
        return expenses.reduce((sum, item) => sum + item.amount, 0);
      }, [expenses]);

      const totalOutflowItems = useMemo(() => {
        return expenses.reduce((sum, item) => sum + item.items, 0);
      }, [expenses]);

      const totalInflow = useMemo(() => {
        return incomes.reduce((sum, item) => sum + item.amount, 0);
      }, [incomes]);

      const totalInflowItems = incomes.length;
      const netTotal = totalInflow - totalOutflow;

      const formatCurrency = (val) => {
        return 'HK$' + val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      const toggleGroup = (name) => {
        setExpandedGroups(prev => ({ ...prev, [name]: !prev[name] }));
      };

      return (
        <div className="flex flex-col h-full text-slate-100 select-none">
          {/* Top Bar */}
          <div className="pt-6 pb-3 px-4 flex items-center justify-between border-b border-gray-800 bg-[#1A1A24]/90 backdrop-blur sticky top-0 z-20">
            <button 
              onClick={() => setView('dashboard')} 
              className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition"
            >
              <Icons.ChevronLeft />
            </button>

            <h1 className="text-lg font-bold tracking-wide">
              {view === 'dashboard' ? 'Living' : 'Settings'}
            </h1>

            <div className="flex items-center space-x-1">
              <button 
                onClick={() => setView(view === 'settings' ? 'dashboard' : 'settings')}
                className={`p-1.5 rounded-full transition ${view === 'settings' ? 'bg-purple-600 text-white' : 'text-gray-300 hover:bg-gray-800'}`}
              >
                <Icons.Settings />
              </button>
              <button className="p-1.5 rounded-full hover:bg-gray-800 text-gray-300 transition">
                <Icons.Grid />
              </button>
            </div>
          </div>

          {view === 'dashboard' ? (
            <div className="flex-1 overflow-y-auto no-scrollbar pb-10">
              {/* Date Header */}
              <div className="flex items-center justify-between px-6 py-3 text-sm text-gray-400 border-b border-gray-800/60 bg-[#161620]">
                <button className="p-1 hover:text-white"><Icons.ChevronLeft /></button>
                <span className="font-medium tracking-wider text-gray-300">09/01/2026 — 09/30/2026</span>
                <button className="p-1 hover:text-white"><Icons.ChevronRight /></button>
              </div>

              {/* Progress Summary Section */}
              <div className="p-4 space-y-3 bg-[#1A1A24]">
                {/* Outflow */}
                <div className="space-y-1">
                  <div className="flex justify-between items-center text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-gray-400 font-medium">Outflow</span>
                      <span className="bg-red-500/20 text-red-400 text-[10px] px-2 py-0.5 rounded-full font-bold">
                        {totalOutflowItems}
                      </span>
                    </div>
                    <span className="font-semibold text-red-400">-{formatCurrency(totalOutflow)}</span>
                  </div>
                  <div className="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div 
                      className="h-full bg-[#FF4D4D] rounded-full transition-all duration-500" 
                      style={{ width: `${Math.min((totalOutflow / (totalInflow || 1)) * 100, 100)}%` }} 
                    />
                  </div>
                </div>

                {/* Inflow */}
                <div className="space-y-1">
                  <div className="flex justify-between items-center text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-gray-400 font-medium">Inflow</span>
                      <span className="bg-green-500/20 text-green-400 text-[10px] px-2 py-0.5 rounded-full font-bold">
                        {totalInflowItems}
                      </span>
                      <button 
                        onClick={() => setShowRemarks(!showRemarks)}
                        className="text-[10px] text-blue-400 bg-blue-500/10 px-1.5 py-0.5 rounded border border-blue-500/20 hover:bg-blue-500/20"
                      >
                        {showRemarks ? 'Hide Remarks' : 'Remarks'}
                      </button>
                    </div>
                    <span className="font-semibold text-emerald-400">{formatCurrency(totalInflow)}</span>
                  </div>
                  <div className="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div className="h-full bg-[#4CAF50] rounded-full w-full" />
                  </div>

                  {/* Remarks Dropdown */}
                  {showRemarks && (
                    <div className="mt-2 p-2.5 bg-gray-900/80 rounded-lg text-xs space-y-1.5 border border-gray-800">
                      <div className="text-gray-400 font-semibold mb-1">Income Sources:</div>
                      {incomes.map((inc) => (
                        <div key={inc.id} className="flex justify-between items-center text-gray-300">
                          <div>
                            <span className="font-medium text-white">{inc.source}:</span>{' '}
                            <span className="text-gray-400 italic text-[11px]">({inc.remark})</span>
                          </div>
                          <span className="text-emerald-400 font-medium">{formatCurrency(inc.amount)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Net Summary */}
                <div className="space-y-1 pt-1">
                  <div className="flex justify-between items-center text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-gray-400 font-medium">Summary</span>
                      <span className="bg-purple-500/20 text-purple-300 text-[10px] px-2 py-0.5 rounded-full font-bold">
                        Net
                      </span>
                    </div>
                    <span className={`font-semibold ${netTotal >= 0 ? 'text-purple-300' : 'text-red-400'}`}>
                      {netTotal >= 0 ? '+' : ''}{formatCurrency(netTotal)}
                    </span>
                  </div>
                  <div className="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div 
                      className="h-full bg-[#9C27B0] rounded-full transition-all duration-500" 
                      style={{ width: `${Math.min((Math.max(netTotal, 0) / (totalInflow || 1)) * 100, 100)}%` }} 
                    />
                  </div>
                </div>
              </div>

              {/* Accordion Categories */}
              <div className="mt-2 divide-y divide-gray-800/60">
                {GROUPS.map((group) => {
                  const isExpanded = expandedGroups[group.name];
                  const groupTotal = group.keys.reduce((sum, k) => {
                    const item = expenses.find(e => e.category === k);
                    return sum + (item ? item.amount : 0);
                  }, 0);

                  return (
                    <div key={group.name} className="bg-[#1A1A24]">
                      <button 
                        onClick={() => toggleGroup(group.name)}
                        className="w-full px-4 py-3 flex justify-between items-center bg-[#181822] hover:bg-[#1f1f2c] transition"
                      >
                        <div className="flex items-center space-x-2">
                          <span className="font-semibold text-sm text-gray-300">{group.name}</span>
                          <span className="bg-gray-800 text-gray-400 text-xs px-2 py-0.5 rounded-full">
                            {group.keys.length}
                          </span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <span className="text-xs font-medium text-gray-400">
                            {formatCurrency(groupTotal)}
                          </span>
                          <span className="text-gray-500">
                            {isExpanded ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
                          </span>
                        </div>
                      </button>

                      {isExpanded && (
                        <div className="divide-y divide-gray-800/40 px-2">
                          {group.keys.map((catKey) => {
                            const item = expenses.find(e => e.category === catKey);
                            if (!item) return null;

                            const budget = budgets[catKey] || 0;
                            const IconComp = Icons[item.icon] || Icons.More;

                            return (
                              <div key={item.id} className="p-3 flex items-center justify-between hover:bg-gray-800/30 rounded-xl transition">
                                <div className="flex items-center space-x-3">
                                  <div className={`w-10 h-10 rounded-full flex items-center justify-center ${item.bg} ${item.color}`}>
                                    <IconComp />
                                  </div>
                                  <div>
                                    <div className="font-medium text-sm text-gray-100">{item.label}</div>
                                    <div className="text-xs text-gray-500">{item.items} Items</div>
                                  </div>
                                </div>

                                <div className="text-right">
                                  <div className="text-sm font-semibold text-red-400">
                                    {formatCurrency(item.amount)}
                                  </div>
                                  <div className="text-xs text-gray-500 mt-0.5">
                                    {budget > 0 
                                      ? `${item.amount.toLocaleString()} / ${budget.toLocaleString()}` 
                                      : 'Unallocated'}
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            /* Settings Page */
            <div className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-6">
              <div>
                <h2 className="text-base font-semibold text-purple-400 mb-1">Monthly Category Budgets</h2>
                <p className="text-xs text-gray-400 mb-4">Set your spending quotas per category.</p>
                
                <div className="space-y-3">
                  {Object.entries(budgets).map(([key, val]) => (
                    <div key={key} className="bg-gray-900/60 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                      <label className="text-sm font-medium text-gray-200">{key}</label>
                      <div className="flex items-center space-x-2">
                        <span className="text-xs text-gray-500">HK$</span>
                        <input 
                          type="number"
                          value={val}
                          onChange={(e) => {
                            const newBudgets = { ...budgets, [key]: Number(e.target.value) };
                            setBudgets(newBudgets);
                          }}
                          className="w-28 bg-gray-800 text-white text-right px-3 py-1.5 rounded-lg text-sm border border-gray-700 focus:outline-none focus:border-purple-500"
                        />
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <h2 className="text-base font-semibold text-emerald-400 mb-1">Income Sources</h2>
                <p className="text-xs text-gray-400 mb-4">Update income numbers & remarks.</p>

                <div className="space-y-3">
                  {incomes.map((inc, index) => (
                    <div key={inc.id} className="bg-gray-900/60 p-3 rounded-xl border border-gray-800 space-y-2">
                      <div className="flex justify-between items-center">
                        <input 
                          type="text" 
                          value={inc.source}
                          onChange={(e) => {
                            const next = [...incomes];
                            next[index].source = e.target.value;
                            setIncomes(next);
                          }}
                          className="bg-transparent font-medium text-sm text-emerald-300 focus:outline-none border-b border-transparent focus:border-emerald-500"
                        />
                        <div className="flex items-center space-x-1">
                          <span className="text-xs text-gray-500">HK$</span>
                          <input 
                            type="number" 
                            value={inc.amount}
                            onChange={(e) => {
                              const next = [...incomes];
                              next[index].amount = Number(e.target.value);
                              setIncomes(next);
                            }}
                            className="w-28 bg-gray-800 text-white text-right px-3 py-1 rounded-lg text-sm border border-gray-700 focus:outline-none focus:border-emerald-500"
                          />
                        </div>
                      </div>
                      <input 
                        type="text"
                        placeholder="Add remark..."
                        value={inc.remark}
                        onChange={(e) => {
                          const next = [...incomes];
                          next[index].remark = e.target.value;
                          setIncomes(next);
                        }}
                        className="w-full bg-gray-800/50 text-gray-300 text-xs px-2.5 py-1 rounded border border-gray-800 focus:outline-none"
                      />
                    </div>
                  ))}
                </div>
              </div>

              <div className="pt-2">
                <button 
                  onClick={() => setView('dashboard')}
                  className="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl shadow-lg transition"
                >
                  Save & Return
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
